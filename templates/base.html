<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Stock Notifier{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- mobile hamburger -->
<button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')" aria-label="Menu">☰</button>

<div class="layout">

    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <aside class="sidebar">
        <div class="sidebar-brand"><span class="dot"></span> StockNotifier</div>
        <ul class="sidebar-nav">
            <li><a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">
                <span class="icon">📊</span> Dashboard
            </a></li>
            <li><a href="{{ url_for('products.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('products') }}">
                <span class="icon">📦</span> Products
            </a></li>
            <li><a href="{{ url_for('users.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('users') }}">
                <span class="icon">👤</span> Users
            </a></li>
            <li><a href="{{ url_for('settings.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('settings') }}">
                <span class="icon">⚙️</span> Settings
            </a></li>
        </ul>
    </aside>

    <!-- ── Main content ────────────────────────────────────────────────── -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- ── Flash toasts ─────────────────────────────────────────────────────── -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-container">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}" onclick="this.remove()">{{ message }}</div>
    {% endfor %}
</div>
<script>
    // Auto-dismiss flashes after 4 seconds
    setTimeout(() => {
        document.querySelectorAll('.flash').forEach(el => {
            el.style.transition = 'opacity .4s';
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 400);
        });
    }, 4000);
</script>
{% endif %}
{% endwith %}

<!-- Close sidebar on outside click (mobile) -->
<script>
    document.querySelector('.main').addEventListener('click', () => {
        document.querySelector('.sidebar').classList.remove('open');
    });
</script>
</body>
</html>
